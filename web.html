<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repository Security Agent</title>
<style>
body { max-width: 880px; margin: 48px auto; padding: 0 24px;
  font: 16px/1.55 system-ui, sans-serif; color: #192231; background: #fafbfc; }
h1 { font-size: 30px; margin-bottom: 8px; }
label { display: block; margin-top: 24px; font-weight: 600; }
textarea { box-sizing: border-box; width: 100%; padding: 12px;
  font: inherit; border: 1px solid #aeb8c5; border-radius: 6px; }
button { margin: 12px 12px 12px 0; padding: 10px 18px; font: inherit;
  background: #2446b0; color: white; border: 0; border-radius: 5px; }
button:disabled { opacity: .5; }
pre { white-space: pre-wrap; overflow-wrap: anywhere; padding: 16px;
  background: #eef1f5; font: 14px/1.5 ui-monospace, monospace; }
#activity { max-height: 340px; overflow: auto; }
#answer { white-space: pre-wrap; overflow-wrap: anywhere; }
small { color: #4a576a; }
</style>
<h1>Repository Security Agent</h1>
<p id="mode">__MODE__</p>
<small>Inspects the source folder selected when the server starts.
Live runs send retrieved source to Gemini. Offline mode is a scripted demo.</small>
<form id="form">
<label for="question">Review question</label>
<textarea id="question" rows="3" maxlength="2000" required>Where does user input go, and what security issues are supported?</textarea>
<button id="run">Run review</button><span id="status" role="status">Ready</span>
</form>
<h2>Tool activity</h2><pre id="activity">No calls yet.</pre>
<h2>Answer</h2><div id="answer" aria-live="polite">No answer yet.</div>
<script>
const form = document.querySelector('#form');
const run = document.querySelector('#run');
const status = document.querySelector('#status');
const activity = document.querySelector('#activity');
const answer = document.querySelector('#answer');
form.addEventListener('submit', async event => {
  event.preventDefault();
  run.disabled = true;
  status.textContent = 'Running…';
  activity.textContent = '';
  answer.textContent = 'Waiting for the agent…';
  let finished = false;
  function display(line) {
    if (!line.trim()) return;
    const item = JSON.parse(line);
    if (item.label === 'FINAL ANSWER') answer.textContent = item.value;
    else if (item.label === 'STATUS') {
      status.textContent = item.value;
      finished = true;
      if (item.value !== 'completed') answer.textContent = 'Review incomplete.';
    } else {
      activity.textContent += item.label + '\n' +
        JSON.stringify(item.value, null, 2) + '\n\n';
    }
  }
  try {
    const response = await fetch('/review', {
      method: 'POST',
      headers: {'Content-Type': 'application/json',
                'X-Review-Token': '__TOKEN__'},
      body: JSON.stringify({question: document.querySelector('#question').value})
    });
    if (!response.ok) throw new Error('Request rejected: ' + response.status);
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let pending = '';
    while (true) {
      const {value, done} = await reader.read();
      if (done) break;
      pending += decoder.decode(value, {stream: true});
      const lines = pending.split('\n');
      pending = lines.pop();
      lines.forEach(display);
    }
    pending += decoder.decode();
    display(pending);
    if (!finished) throw new Error('Connection closed before completion.');
  } catch (error) {
    status.textContent = 'incomplete';
    answer.textContent = error.message;
  } finally { run.disabled = false; }
});
</script>
</html>
