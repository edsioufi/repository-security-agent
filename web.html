<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repository Security Agent</title>
<style>
body { max-width: 880px; margin: 48px auto; padding: 0 24px;
  font: 16px/1.55 system-ui, sans-serif; color: #192231; background: #fafbfc; }
h1 { font-size: 30px; margin-bottom: 8px; }
button { margin: 12px 12px 12px 0; padding: 10px 18px; font: inherit;
  background: #2446b0; color: white; border: 0; border-radius: 5px; }
button:disabled { opacity: .5; }
pre { white-space: pre-wrap; overflow-wrap: anywhere; padding: 16px;
  background: #eef1f5; font: 14px/1.5 ui-monospace, monospace; }
#activity { max-height: 340px; overflow: auto; }
#answer { white-space: pre-wrap; overflow-wrap: anywhere; }
small { color: #4a576a; }
input { box-sizing: border-box; width: 100%; padding: 10px; font: inherit;
  border: 1px solid #b8c2d0; border-radius: 5px; }
label { display: block; margin-bottom: 6px; }
</style>
<h1>Repository Security Agent</h1>
<p>Review a local repository for security issues.</p>
<form id="form">
<label for="repo">Repository folder</label>
<input id="repo" value="__REPO__" placeholder="Choose a folder or paste its path"
  required autocomplete="off" spellcheck="false">
<button type="button" id="browse">Choose folder…</button>
<button id="run">Run review</button>
<span id="status" role="status">Ready</span>
</form>
<small>Live reviews send retrieved source to Gemini.</small>
<h2>Tool activity</h2><pre id="activity">No calls yet.</pre>
<h2>Answer</h2><div id="answer" aria-live="polite">No answer yet.</div>
<script>
const form = document.querySelector('#form');
const run = document.querySelector('#run');
const status = document.querySelector('#status');
const activity = document.querySelector('#activity');
const answer = document.querySelector('#answer');
const repo = document.querySelector('#repo');
const browse = document.querySelector('#browse');
const headers = {'Content-Type': 'application/json',
                 'X-Review-Token': '__TOKEN__'};
browse.addEventListener('click', async () => {
  browse.disabled = run.disabled = true;
  status.textContent = 'Choose a folder in the system dialog…';
  try {
    const response = await fetch('/folder', {
      method: 'POST', headers, body: '{}'
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error);
    if (result.path) repo.value = result.path;
    status.textContent = result.path ? 'Ready' : 'Folder selection cancelled.';
  } catch (error) { status.textContent = error.message; }
  finally { browse.disabled = run.disabled = false; }
});
form.addEventListener('submit', async event => {
  event.preventDefault();
  run.disabled = browse.disabled = repo.disabled = true;
  status.textContent = 'Running…';
  activity.textContent = '';
  answer.textContent = 'Waiting for the agent…';
  let finished = false;
  function display(line) {
    if (!line.trim()) return;
    const item = JSON.parse(line);
    if (item.label === 'FINAL ANSWER') answer.textContent = item.value;
    else if (item.label === 'STATUS') {
      status.textContent = item.value;
      finished = true;
      if (item.value !== 'completed') answer.textContent = 'Review incomplete.';
    } else {
      activity.textContent += item.label + '\n' +
        JSON.stringify(item.value, null, 2) + '\n\n';
    }
  }
  try {
    const response = await fetch('/review', {
      method: 'POST',
      headers,
      body: JSON.stringify({repo: repo.value})
    });
    if (!response.ok) {
      const failure = await response.json();
      throw new Error(failure.error || 'Review could not start.');
    }
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let pending = '';
    while (true) {
      const {value, done} = await reader.read();
      if (done) break;
      pending += decoder.decode(value, {stream: true});
      const lines = pending.split('\n');
      pending = lines.pop();
      lines.forEach(display);
    }
    pending += decoder.decode();
    display(pending);
    if (!finished) throw new Error('Connection closed before completion.');
  } catch (error) {
    status.textContent = 'incomplete';
    answer.textContent = error.message;
  } finally { run.disabled = browse.disabled = repo.disabled = false; }
});
</script>
</html>
